# 4 раза в сутки (шаг 3 — только ночной запуск и ручной):
#   1. скачать копию коллекции из AnkiWeb (ankiweb_sync.py);
#   2. новые слова, которые Женя записал в AnkiDroid в колоду «Новые слова» → data/zhenya_inbox.tsv
#      (inbox.py);
#   3. если есть слова «ждёт» — Claude Code (подписка Pro, секрет CLAUDE_CODE_OAUTH_TOKEN) пишет строки
#      колоды по .claude/skills/add-words/nightly_prompt.md; zhenya_apply.py проверяет, импортирует
#      (слова Жени — первыми), убирает их из ящика и отправляет в AnkiWeb обычной синхронизацией;
#      не прошло — правки Claude откатываются, слова остаются «ждёт», запуск — с ошибкой (письмо);
#   4. построить страницы (index.html — график, words.html — для репетитора) → GitHub Pages;
#   5. закоммитить data/ в main.
# Время — 01:30, 07:30, 13:30, 19:30 UTC (на Кипре 03:30/09:30/15:30/21:30 зимой, летом на час позже).
# GitHub запускает по расписанию с опозданием: в ноябре 2026 ночной стартовал в 08–11 UTC, поэтому
# одного запуска мало — днём график отставал почти на двое суток. Слова Жени — только ночной
# запуск (днём Женя может заниматься, колоду в это время не трогаем). Запустить вручную: вкладка Actions → «Отчёт» → Run workflow
# (галочка «Сухой прогон» — Claude и проверки работают, но в AnkiWeb и git ничего не уходит,
# что сделал бы Claude — в журнале шага «Сухой прогон: что изменилось бы»).
# Секреты: ANKIWEB_HKEY (ключ входа из auth.json, не пароль), ANKIWEB_ENDPOINT, CLAUDE_CODE_OAUTH_TOKEN.
name: Отчёт

on:
  schedule:
    - cron: "30 1 * * *"         # ночной: отчёт + слова Жени (строку не менять — по ней шаг Claude)
    - cron: "30 7,13,19 * * *"   # днём: только отчёт (график, страница слов)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: слова Жени не отправлять в AnkiWeb и не коммитить"
        type: boolean
        default: false

# Два этапа, как в шаблоне GitHub: build строит страницы и сохраняет историю слов, deploy выкладывает.
# В одном этапе deploy-pages иногда «не находит» только что загруженные страницы (15.11.2026).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Nicosia          # день в Anki и время на страницах — по Кипру
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # коммит data/
      actions: write   # шаг «не дать GitHub отключить расписание»
    outputs:
      inbox: ${{ steps.inbox.outcome }}
      claude: ${{ steps.claude.outcome }}
      apply: ${{ steps.apply.outcome }}
    env:
      ANKIWEB_HKEY: ${{ secrets.ANKIWEB_HKEY }}
      ANKIWEB_ENDPOINT: ${{ secrets.ANKIWEB_ENDPOINT }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/report.yml

      - name: Пакеты anki (как у Anki на компьютере) и genanki (сборка колоды)
        run: pip install anki==26.9.4 genanki==0.13.1

      - name: Скачать копию коллекции из AnkiWeb
        run: python .claude/skills/zhenya-progress/ankiweb_sync.py

      - name: Новые слова Жени (ящик «Новые слова» → data/zhenya_inbox.tsv)
        id: inbox
        continue-on-error: true   # отчёт строится и без этого шага; ошибка — в конце
        run: |
          python .claude/skills/zhenya-progress/inbox.py
          cp data/zhenya_inbox.tsv "$RUNNER_TEMP/inbox.tsv"

      - name: Слова Жени → строки колоды (Claude)
        id: claude
        if: >-
          steps.inbox.outcome == 'success' && steps.inbox.outputs.waiting != '0' &&
          (github.event_name != 'schedule' || github.event.schedule == '30 1 * * *')
        continue-on-error: true
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g --silent @anthropic-ai/claude-code
          claude -p "$(cat .claude/skills/add-words/nightly_prompt.md)" --max-turns 80 \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(python .claude/skills/add-words/check_words.py:*)"

      - name: Слова Жени → колода в AnkiWeb (проверка, импорт, отправка)
        id: apply
        if: steps.claude.outcome == 'success'
        continue-on-error: true
        run: python .claude/skills/add-words/zhenya_apply.py $([ "$DRY_RUN" = true ] || echo --push)

      - name: Сухой прогон или ошибка — что изменилось бы, и откат правок Claude
        if: steps.claude.outcome != 'skipped' && (env.DRY_RUN == 'true' || steps.apply.outcome != 'success')
        run: |
          git --no-pager diff --stat -- data/
          git --no-pager diff -- data/
          git checkout -- data/
          cp "$RUNNER_TEMP/inbox.tsv" data/zhenya_inbox.tsv

      - name: Построить страницы
        run: |
          python .claude/skills/zhenya-progress/daily_chart.py
          python .claude/skills/zhenya-progress/words_page.py
          mkdir -p site
          cp out/zhenya-progress.html site/index.html
          cp out/zhenya-words.html site/words.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Сохранить слова Жени и историю в git
        if: steps.inbox.outcome == 'success' && env.DRY_RUN != 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Новые слова Жени: $(date +%F)"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      # Расписание в открытом репозитории GitHub отключает после 60 дней без коммитов —
      # повторное включение каждую ночь сбрасывает этот счётчик.
      - name: Не дать GitHub отключить расписание
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/report.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Ошибка в словах Жени — письмо владельцу (что именно — в журнале этапа build)
        if: >-
          needs.build.outputs.inbox == 'failure' || needs.build.outputs.claude == 'failure' ||
          needs.build.outputs.apply == 'failure'
        run: |
          echo "inbox=${{ needs.build.outputs.inbox }} claude=${{ needs.build.outputs.claude }} apply=${{ needs.build.outputs.apply }}"
          exit 1
