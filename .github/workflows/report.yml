# Каждую ночь: скачать копию коллекции из AnkiWeb (только скачивание), построить две страницы
# отчёта и выложить их на GitHub Pages:
#   index.html — график «Как занимается Женя», words.html — «Слова Жени» для репетитора.
# Заодно обновляет историю новых слов, которые Женя записал в AnkiDroid в колоду «Новые слова»
# (data/zhenya_inbox.tsv, inbox.py), и коммитит её в main — по ней строится график на index.html.
# Время — 01:30 UTC: на Кипре 03:30 зимой и 04:30 летом; GitHub иногда опаздывает до часа,
# поэтому к 6:00 страницы уже новые. Запустить вручную: вкладка Actions → «Отчёт» → Run workflow.
# Секреты репозитория: ANKIWEB_HKEY (ключ входа из auth.json, не пароль), ANKIWEB_ENDPOINT.
name: Отчёт

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# Два этапа, как в шаблоне GitHub: build строит страницы и сохраняет историю слов, deploy выкладывает.
# В одном этапе deploy-pages иногда «не находит» только что загруженные страницы (15.11.2026).

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Nicosia          # день в Anki и время на страницах — по Кипру
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # коммит data/zhenya_inbox.tsv
      actions: write   # шаг «не дать GitHub отключить расписание»
    outputs:
      inbox: ${{ steps.inbox.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/report.yml

      - name: Пакет anki (как у Anki на компьютере)
        run: pip install anki==26.9.4

      - name: Скачать копию коллекции из AnkiWeb
        env:
          ANKIWEB_HKEY: ${{ secrets.ANKIWEB_HKEY }}
          ANKIWEB_ENDPOINT: ${{ secrets.ANKIWEB_ENDPOINT }}
        run: python .claude/skills/zhenya-progress/ankiweb_sync.py

      - name: Новые слова Жени (ящик «Новые слова» → data/zhenya_inbox.tsv)
        id: inbox
        continue-on-error: true   # отчёт строится и без этого шага; ошибка — в последнем шаге
        run: python .claude/skills/zhenya-progress/inbox.py

      - name: Построить страницы
        run: |
          python .claude/skills/zhenya-progress/daily_chart.py
          python .claude/skills/zhenya-progress/words_page.py
          mkdir -p site
          cp out/zhenya-progress.html site/index.html
          cp out/zhenya-words.html site/words.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Сохранить историю новых слов в git
        id: commit
        if: steps.inbox.outcome == 'success'
        run: |
          git add data/zhenya_inbox.tsv
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Новые слова Жени: история на $(date +%F)"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      # Расписание в открытом репозитории GitHub отключает после 60 дней без коммитов —
      # повторное включение каждую ночь сбрасывает этот счётчик.
      - name: Не дать GitHub отключить расписание
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/report.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Ошибка в шаге «Новые слова Жени» — письмо владельцу
        if: needs.build.outputs.inbox == 'failure'
        run: exit 1
